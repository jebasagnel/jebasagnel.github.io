name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html styles.css script.js .nojekyll _site/
          mkdir -p _site/assets/the-boring-blog/standalone-hero/art/situations
          mkdir -p _site/assets/the-boring-blog/standalone-hero/sky
          mkdir -p _site/assets/images
          cp -R assets/fonts assets/icons assets/audio _site/assets/
          cp assets/images/portfolio-cat.webp _site/assets/images/
          cp assets/the-boring-blog/standalone-hero/index.html _site/assets/the-boring-blog/standalone-hero/
          cp assets/the-boring-blog/standalone-hero/sky/dawn.webp _site/assets/the-boring-blog/standalone-hero/sky/
          cp assets/the-boring-blog/standalone-hero/art/situations/*.webp _site/assets/the-boring-blog/standalone-hero/art/situations/
          cp -R "New Resume Box" _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
